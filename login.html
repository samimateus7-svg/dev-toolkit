<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access | dev-toolkit</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0b; color: #e0e0e0; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; background-color: #0f0f0f; border-bottom: 1px solid #1a1a1a; }
        .logo { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; }
        .auth-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-card { background-color: #141416; border: 1px solid #222225; width: 100%; max-width: 400px; padding: 40px; border-radius: 8px; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 1px solid #222225; }
        .tab { flex: 1; text-align: center; padding-bottom: 12px; color: #666666; cursor: pointer; font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        .tab.active { color: #e5a93b; border-bottom: 2px solid #e5a93b; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: #888888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        input { width: 100%; box-sizing: border-box; background-color: #0b0b0c; border: 1px solid #2d2d31; padding: 12px 16px; border-radius: 4px; color: #ffffff; font-family: 'Inter', sans-serif; font-size: 14px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #e5a93b; }
        .submit-btn { width: 100%; background-color: #e5a93b; color: #000000; border: none; padding: 14px; border-radius: 4px; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
        .submit-btn:hover { background-color: #f1b955; }

        /* 👑 NOTIFICACIÓN TOAST PREMIUM (Borde Dorado) */
        .toast-notification {
            position: fixed;
            top: 30px;
            right: 30px;
            background-color: #141416;
            border-left: 4px solid #e5a93b; /* Detalle dorado */
            border-top: 1px solid #222225;
            border-right: 1px solid #222225;
            border-bottom: 1px solid #222225;
            padding: 16px 24px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-notification.show {
            transform: translateX(0); /* Desliza elegantemente */
        }

        .toast-icon {
            color: #00e676; /* Checkmark verde neón */
            font-size: 18px;
            font-weight: bold;
        }

        .toast-message {
            color: #ffffff;
            font-size: 14px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">dev-toolkit</a></header>
    <div class="auth-container">
        <div class="auth-card">
            <div class="tabs">
                <div class="tab active" id="login-tab" onclick="switchTab('login')">Sign In</div>
                <div class="tab" id="signup-tab" onclick="switchTab('signup')">Sign Up</div>
            </div>
            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="form-group" id="user-group" style="display: none;">
                    <label>Username</label>
                    <input type="text" id="username-input" placeholder="Your username">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email-input" placeholder="name@domain.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn" id="action-btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- HTML de la Notificación Flotante Elegante -->
    <div id="toast" class="toast-notification">
        <span class="toast-icon">✓</span>
        <span id="toast-text" class="toast-message">Success! Redirecting...</span>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(type) {
            currentMode = type;
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const userGroup = document.getElementById('user-group');
            const actionBtn = document.getElementById('action-btn');
            const usernameInput = document.getElementById('username-input');
            
            if(type === 'login') {
                loginTab.classList.add('active'); signupTab.classList.remove('active');
                userGroup.style.display = 'none'; actionBtn.innerText = 'Sign In';
                usernameInput.removeAttribute('required');
            } else {
                signupTab.classList.add('active'); loginTab.classList.remove('active');
                userGroup.style.display = 'block'; actionBtn.innerText = 'Create Account';
                usernameInput.setAttribute('required', 'true');
            }
        }

        function handleAuthSubmit(event) {
            event.preventDefault(); // Evita recargar la página
            
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            const email = document.getElementById('email-input').value;
            const username = document.getElementById('username-input').value;
            
            // Personaliza el mensaje de forma pro y real según la pestaña activa
            if (currentMode === 'login') {
                toastText.innerText = `Welcome back! Authentication successful.`;
            } else {
                toastText.innerText = `Account created successfully! Welcome, ${username}.`;
            }
            
            // Muestra la alerta bonita deslizando desde la derecha
            toast.classList.add('show');
            
            // Espera 2.5 segundos para que se aprecie la interfaz y vuelve al Home
            setTimeout(() => {
                window.location.href = "index.html";
            }, 2500);
        }
    </script>
</body>
</html>
