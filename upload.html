<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Code | dev-toolkit</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">

    <!-- Símbolo favicon de la pestaña -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0b0b; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
        }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 25px 50px; 
            background-color: #0f0f0f; 
            border-bottom: 1px solid #1a1a1a; 
        }
        
        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 22px; 
            font-weight: 600; 
            color: #ffffff; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-decoration: none; 
        }
        
        .container { 
            max-width: 800px; 
            margin: 100px auto; 
            padding: 0 20px; 
            text-align: center; 
        }
        
        h1 { 
            font-family: 'Cinzel', serif; 
            font-size: 36px; 
            color: #ffffff; 
            font-weight: 400; 
            margin-bottom: 15px; 
        }
        
        .subtitle { 
            color: #888888; 
            font-size: 16px; 
            margin-bottom: 50px; 
            font-weight: 300; 
            line-height: 1.6;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }
        
        /* Caja del Gateway */
        .gateway-card { 
            background-color: #141416; 
            border: 1px solid #222225; 
            padding: 50px 40px; 
            border-radius: 8px; 
            display: inline-block; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        /* Botón de Enlace al Formulario */
        .btn-gate {
            display: block;
            width: 100%;
            max-width: 320px;
            background-color: #e5a93b; 
            padding: 16px 20px; 
            border-radius: 4px; 
            color: #000000; 
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(229, 169, 59, 0.2);
            box-sizing: border-box;
        }

        .btn-gate:hover { 
            background-color: #f1b955;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 169, 59, 0.3);
        }

        /* Botón Secundario Volver */
        .btn-back {
            display: inline-block;
            background-color: transparent; 
            color: #a0a0a0;
            border: 1px solid #333333;
            padding: 14px 40px; 
            border-radius: 4px; 
            font-weight: 500;
            font-size: 13px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
        }

        .btn-back:hover { 
            border-color: #ffffff;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">dev-toolkit</a></header>
    
    <main class="container">
        <h1>Contribute Snippet</h1>
        <p class="subtitle">Share your functional scripts with the developer community via our verified form gateway.</p>
        
        <div class="gateway-card">
            <div class="btn-container">
                <!-- El enlace abre tu Google Form en una pestaña nueva limpia y sin bloqueos corporativos -->
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSfUk5ntzh_gzE53MoggFdkSNpUBPuK0uWpQFjAwJ1kHy1Lrsg/viewform?usp=dialog" target="_blank" class="btn-gate">Open Form to upload your code ➔</a>
                
                <!-- Botón para regresar al Home -->
                <a href="index.html" class="btn-back">← Back to Home</a>
            </div>
        </div>
    </main>
</body>
</html>
