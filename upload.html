<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Code | dev-toolkit</title>
    <!-- Fuentes premium de Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Base Estética Premium en Modo Oscuro */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0b0b0b; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
        }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 25px 50px; 
            background-color: #0f0f0f; 
            border-bottom: 1px solid #1a1a1a; 
        }
        
        .logo { 
            font-family: 'Cinzel', serif; 
            font-size: 22px; 
            font-weight: 600; 
            color: #ffffff; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            text-decoration: none; 
        }
        
        .container { 
            max-width: 800px; 
            margin: 60px auto; 
            padding: 0 20px; 
            text-align: center; 
        }
        
        h1 { 
            font-family: 'Cinzel', serif; 
            font-size: 32px; 
            color: #ffffff; 
            font-weight: 400; 
            margin-bottom: 10px; 
        }
        
        .subtitle { 
            color: #666666; 
            font-size: 15px; 
            margin-bottom: 40px; 
            font-weight: 300; 
        }
        
        /* Envoltura Premium para Centrar la Ventana del Formulario */
        .form-wrapper { 
            background-color: #141416; 
            border: 1px solid #222225; 
            padding: 12px; 
            border-radius: 8px; 
            display: inline-block; 
            width: 100%; 
            max-width: 660px; 
            box-shadow: 0 15px 30px rgba(0,0,0,0.5); 
            overflow: hidden; 
            box-sizing: border-box;
            margin-bottom: 40px; /* Espacio para que el botón respire abajo */
        }

        /* Ventana interna nativa limpia */
        iframe { 
            width: 100%; 
            border: none; 
            border-radius: 4px; 
            background-color: #ffffff; 
            display: block;
        }

        /* 👑 BOTÓN VOLVER DORADO PREMIUM */
        .back-container {
            margin-top: 10px;
            margin-bottom: 60px;
        }

        .btn-back {
            display: inline-block;
            background-color: #e5a93b; 
            padding: 14px 40px; 
            border-radius: 4px; 
            color: #000000; 
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(229, 169, 59, 0.2);
        }

        .btn-back:hover { 
            background-color: #f1b955;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header><a href="index.html" class="logo">dev-toolkit</a></header>
    
    <main class="container">
        <h1>Contribute Snippet</h1>
        <div class="subtitle">Submit your functional script directly through our secure Google Forms gateway.</div>
        
        <div class="form-wrapper">
            <!-- Tu código de incrustación real y nativo -->
            <iframe src="https://google.com" width="640" height="1275" frameborder="0" marginheight="0" marginwidth="0">Cargando…</iframe>
        </div>

        <!-- 👑 Aquí está el contenedor con el nuevo botón volver -->
        <div class="back-container">
            <a href="index.html" class="btn-back">← Back to Home</a>
        </div>
    </main>
</body>
</html>
