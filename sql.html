<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Toolkit | dev-toolkit</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0b0b; color: #e0e0e0; margin: 0; padding: 0; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 25px 50px; background-color: #0f0f0f; border-bottom: 1px solid #1a1a1a; }
        .logo { font-family: 'Cinzel', serif; font-size: 22px; font-weight: 600; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; }
        
        /* 👑 BOTÓN VOLVER PREMIUM */
        .btn-back { background-color: #e5a93b; padding: 10px 22px; border-radius: 4px; color: #000000; text-decoration: none; font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; transition: background-color 0.3s; }
        .btn-back:hover { background-color: #f1b955; }

        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        .category-header { border-bottom: 1px solid #1a1a1a; padding-bottom: 30px; margin-bottom: 40px; }
        h1 { font-family: 'Cinzel', serif; font-size: 32px; color: #ffffff; font-weight: 400; margin: 0 0 10px 0; }
        .tech-badge { background-color: #0f2d3a; color: #38bdf8; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 15px; }
        .code-list { display: flex; flex-direction: column; gap: 30px; }
        .code-item { background-color: #141416; border: 1px solid #222225; border-radius: 8px; padding: 30px; }
        .code-title { color: #ffffff; font-size: 20px; font-weight: 500; margin: 0 0 10px 0; }
        .code-description { color: #888888; font-size: 15px; line-height: 1.6; margin-bottom: 20px; font-weight: 300; }
        .code-snippet { background-color: #0b0b0c; border: 1px solid #1a1a1c; border-radius: 6px; padding: 18px; font-family: 'Courier New', Courier, monospace; font-size: 14px; color: #abb2bf; overflow-x: auto; margin: 0 0 20px 0; white-space: pre; line-height: 1.5; }
        
        .sql-key { color: #c678dd; font-weight: 600; } .sql-fun { color: #61afef; } .sql-fld { color: #e06c75; } .sql-num { color: #d19a66; }
        .actions-container { display: flex; gap: 15px; }
        .action-btn { padding: 10px 20px; font-size: 13px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-download { background-color: #e5a93b; color: #000000; border: none; font-weight: 600; }
        .btn-download:hover { background-color: #f1b955; }
        .btn-copy { background-color: transparent; color: #ffffff; border: 1px solid #333333; }
        .btn-copy:hover { background-color: #1a1a1c; border-color: #666666; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="logo">dev-toolkit</a>
        <a href="index.html" class="btn-back">← Back to Categories</a>
    </header>
    <main class="container">
        <div class="category-header">
            <span class="tech-badge">SQL</span>
            <h1>Database Queries</h1>
        </div>
        <div class="code-list">
            <div class="code-item">
                <h2 class="code-title">Find Duplicate Rows Script</h2>
                <p class="code-description">An optimized query design to locate duplicate records across specific columns inside any relational database table.</p>
                <pre class="code-snippet" id="sql-duplicates"><span class="sql-key">SELECT</span> <span class="sql-fld">email</span>, <span class="sql-fun">COUNT</span>(<span class="sql-fld">email</span>)
<span class="sql-key">FROM</span> <span class="sql-fld">users</span>
<span class="sql-key">GROUP BY</span> <span class="sql-fld">email</span>
<span class="sql-key">HAVING</span> <span class="sql-fun">COUNT</span>(<span class="sql-fld">email</span>) > <span class="sql-num">1</span>;</pre>
                <div class="actions-container">
                    <button class="action-btn btn-copy" onclick="copyToClipboard('sql-duplicates', this)">Copy Code</button>
                    <button class="action-btn btn-download" onclick="downloadCode('sql-duplicates', 'find_duplicates.sql')">Download .sql</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        function copyToClipboard(elementId, button) {
            const codeText = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                const originalText = button.innerText; button.innerText = "✓ Copied!"; button.style.borderColor = "#00e676"; button.style.color = "#00e676";
                setTimeout(() => { button.innerText = originalText; button.style.borderColor = "#333333"; button.style.color = "#ffffff"; }, 2000);
            });
        }
        function downloadCode(elementId, filename) {
            const codeText = document.getElementById(elementId).innerText;
            const blob = new Blob([codeText], { type: 'text/x-sql' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
